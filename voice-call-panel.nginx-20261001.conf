server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 217.19.122.37;
    ssl_certificate /etc/voice-call-panel/tls/panel.crt;
    ssl_certificate_key /etc/voice-call-panel/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VoicePanelTLS:10m;
    server_tokens off;
    client_max_body_size 96k;
    client_body_timeout 10s;
    access_log off;
    error_log /var/log/nginx/voice-call-panel-error.log warn;

    location /dialogs {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location /recordings/ {
        proxy_pass http://127.0.0.1:8888/buckets/voice-recordings/;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/dialogs/link.css"></head>';
        sub_filter '</a><button id="logout"' '</a><a class="dialogs-link" href="/dialogs"><span class="brand-divider">/</span><span class="brand-sub">Диалоги</span></a><button id="logout"';
        sub_filter_once off;
        sub_filter_types *;
    }
}
